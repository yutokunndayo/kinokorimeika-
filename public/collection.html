<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシピ図鑑 | グルメメイカー</title>
    <link rel="stylesheet" href="./css/common.css">
    <style>
        .page-title { color: #ff6b6b; margin-bottom: 20px; }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            padding-bottom: 30px;
        }
        .recipe-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .recipe-card:active { transform: scale(0.95); }
        .card-image { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .card-info { padding: 10px; text-align: left; }
        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 20px;
            padding: 20px;
            position: relative;
            text-align: left;
        }
        .close-btn {
            position: sticky;
            top: 0;
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
            background: #f0f0f0;
            border-radius: 50%;
            width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        .modal-body h2 { color: #ff6b6b; font-size: 1.3rem; margin-top: 10px; }
        .modal-body h4 { border-bottom: 2px solid #fff0f0; margin: 20px 0 10px 0; padding-bottom: 5px; color: #ff6b6b; }
        .modal-body ul { padding-left: 20px; }
        .modal-body li { margin-bottom: 8px; line-height: 1.4; }
        .modal-image { width: 100%; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .summary-text { color: #666; font-style: italic; background: #fff9f9; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="page-title">マイレシピ図鑑</h2>
        
        <div id="recipe-list" class="recipe-grid">
            <p style="grid-column: 1/-1; color:#999;">レシピを読み込んでいます...</p>
        </div>

        <button onclick="location.href='index.html'" class="button" style="background:#ddd; color:#555; margin-top:20px;">
            TOPへ戻る
        </button>
    </div>

    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        function showDetail(recipe) {
            const modal = document.getElementById('recipe-modal');
            const body = document.getElementById('modal-body');
            
            let stepsHtml = '<li>手順情報なし</li>';
            if (recipe.steps) {
                const stepsArray = typeof recipe.steps === 'string' ? recipe.steps.split('\n') : recipe.steps;
                stepsHtml = stepsArray.map((step, i) => `<li><strong>${i+1}.</strong> ${step}</li>`).join('');
            }

            const ingredientsHtml = Array.isArray(recipe.ingredients) && recipe.ingredients.length > 0
                ? recipe.ingredients.join('、') 
                : '不明';

            const imgSrc = recipe.image || './img/gurumeika-3.jpg';

            body.innerHTML = `
                <img src="${imgSrc}" class="modal-image">
                <h2>${recipe.recipeName}</h2>
                <div class="summary-text">${recipe.description || '解説なし'}</div>
                <h4>材料</h4><p>${ingredientsHtml}</p>
                <h4>作り方</h4><ul>${stepsHtml}</ul>
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('recipe-modal').style.display = 'none';
        }

        window.onclick = (event) => {
            if (event.target == document.getElementById('recipe-modal')) closeModal();
        };

        // --- ここから読み込み処理 ---
        async function loadCollection() {
            try {
                const response = await fetch('/api/my-recipes');
                
                // ログインしていない場合
                if (response.status === 401) {
                    alert("マイレシピを見るにはログインが必要です");
                    window.location.href = './login.html';
                    return;
                }

                const recipes = await response.json();
                const listElement = document.getElementById('recipe-list');
                listElement.innerHTML = '';

                if (!recipes || recipes.length === 0) {
                    listElement.innerHTML = '<p style="grid-column: 1/-1; padding:20px;">まだレシピがありません。<br>いろいろ作ってみよう！</p>';
                    return;
                }

                recipes.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    const imgUrl = recipe.image || './img/gurumeika-3.jpg';
                    
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${recipe.recipeName}" class="card-image" loading="lazy">
                        <div class="card-info">
                            <h3 class="card-title">${recipe.recipeName}</h3>
                        </div>
                    `;
                    card.onclick = () => showDetail(recipe);
                    listElement.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('recipe-list').innerHTML = '<p>読み込みエラーが発生しました</p>';
            }
        }

        loadCollection();
    </script>
</body>
</html>
