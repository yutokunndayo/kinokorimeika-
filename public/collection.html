<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レシピ図鑑 - グルメメイカー</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .collection-container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .recipe-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recipe-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .recipe-info h3 { color: #ff6b6b; margin: 0 0 5px 0; }
        .summary { font-weight: bold; color: #555; }
        .detail { font-size: 0.9rem; color: #666; margin-top: 5px; white-space: pre-wrap; }
        .steps-box { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-top: 10px; }
        .back-btn { display: block; width: 100%; text-align: center; padding: 10px; background: #ddd; text-decoration: none; color: #333; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="collection-container">
        <h2 style="text-align: center; color: white; text-shadow: 1px 1px 2px black;">マイレシピ図鑑</h2>
        <div id="recipe-list">
            <p style="text-align:center; color:white;">読み込み中...</p>
        </div>
        <a href="index.html" class="back-btn">TOPへ戻る</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('recipe-list');
            try {
                const res = await fetch('/api/my-recipes');
                if (res.status === 401) {
                    alert('ログインしてください');
                    window.location.href = 'login.html';
                    return;
                }
                const recipes = await res.json();
                
                if (recipes.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:white;">まだレシピがありません。</p>';
                    return;
                }

                list.innerHTML = '';
                recipes.forEach(recipe => {
                    // 全ての生成テキストを表示
                    const stepsList = Array.isArray(recipe.steps) 
                        ? recipe.steps.map(s => `<li>${s}</li>`).join('') 
                        : `<li>${recipe.steps}</li>`;
                        
                    const html = `
                        <div class="recipe-card">
                            <img src="${recipe.image || '/img/gurumeika-3.jpg'}" alt="${recipe.recipeName}">
                            <div class="recipe-info">
                                <h3>${recipe.recipeName}</h3>
                                <p class="summary">"${recipe.summary || 'キャッチコピーなし'}"</p>
                                <details>
                                    <summary>詳細解説を見る</summary>
                                    <p class="detail">${recipe.detail || recipe.description}</p>
                                </details>
                                <details>
                                    <summary>作り方・材料</summary>
                                    <div class="steps-box">
                                        <strong>材料:</strong> ${recipe.ingredients.join(', ')}<br><br>
                                        <strong>手順:</strong>
                                        <ul style="padding-left: 20px; margin: 5px 0;">${stepsList}</ul>
                                    </div>
                                </details>
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            } catch (e) {
                console.error(e);
                list.innerHTML = '<p>読み込みエラー</p>';
            }
        });
    </script>
</body>
</html>
