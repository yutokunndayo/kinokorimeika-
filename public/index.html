<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グルメメイカー</title>
    <link rel="stylesheet" href="./css/title.css">
    <link rel="stylesheet" href="./css/common.css">
</head>
<body>
    <div style="position:absolute; top:10px; right:10px;">
    <span id="user-display" style="margin-right:10px; font-weight:bold;"></span>
    <button id="auth-btn" class="button" style="padding:5px 15px; font-size:0.8rem;">ログイン</button>
</div>

<script>
    // ログイン状態チェック
    fetch('/api/me').then(r => r.json()).then(data => {
        const btn = document.getElementById('auth-btn');
        const display = document.getElementById('user-display');
        
        if (data.loggedIn) {
            display.textContent = `${data.username}さん`;
            btn.textContent = 'ログアウト';
            btn.onclick = async () => {
                await fetch('/api/logout', { method: 'POST' });
                window.location.reload();
            };
        } else {
            btn.textContent = 'ログイン';
            btn.onclick = () => window.location.href = './login.html';
        }
    });
</script>
    <div class="container">
        <div class="title-logo">
            <img src="./img/gurumeika-.png" alt="グルメメイカー" class="main-logo">
            
            <div class="mascot-area">
                <img src="./img/gurumeika-3.jpg" alt="タコのシェフ" class="mascot-img">
            </div>
        </div>
        
        <p style="text-align: center; color: #ff8ba7; margin-bottom: 30px; font-weight:bold; font-size: 1rem; background:#fff; padding:5px 10px; border-radius:10px;">
            冷蔵庫の余り物が<br>魔法のレシピに大変身！
        </p>

        <button id="btn-1" class="button">
            <span class="icon">🍳</span> 余り物をリメイク
        </button>
        <button id="btn-2" class="button">
            <span class="icon">🎁</span> レシピガチャ
        </button>
        <button id="btn-3" class="button"><span class="icon">📖</span> レシピ図鑑</button>
    </div>
    <script src="./js/title.js"></script>
</body>
</html>
