<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシピガチャ | キノコリメイカー</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/gacha.css">
    
    <style>
        /* --- UI調整スタイル --- */
        
        .gacha-machine-container {
            background: #fff;
            border-radius: 20px;
            /* 余白を小さくして高さを抑える */
            padding: 20px 15px;
            margin: 15px auto;
            max-width: 500px;
            /* 高さは中身に合わせて自動調整（固定しない） */
            height: auto;
            
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* 待機画面のエリア（余白削減） */
        .machine-illustration {
            display: block;
            padding: 10px 0; 
        }

        /* 絵文字を少し小さくして高さを節約 */
        .emoji-icon {
            font-size: 3.5rem; 
            display: inline-block;
            margin-bottom: 5px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .machine-text {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
        }

        /* 結果表示エリア */
        .result-view {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 画像コンテナ：サイズを抑えて縦長化を防ぐ */
        .image-container {
            width: 100%;
            max-width: 240px; /* 画像サイズを少し縮小 */
            aspect-ratio: 1 / 1;
            margin: 0 auto 10px;
            border-radius: 15px;
            overflow: hidden;
            background: #f9f9f9;
            border: 3px solid #ffe3e3;
        }

        .gacha-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-name {
            font-size: 1.2rem;
            color: #ff6b6b;
            margin-bottom: 8px;
            font-weight: bold;
            line-height: 1.3;
        }

        .description-text {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        /* 材料リスト */
        .ingredients-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 0;
        }

        .ingredients-list li {
            background: #fff0f0;
            color: #ff6b6b;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid #ffcaca;
        }

        /* ボタン周り */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 300px;
            margin: 10px auto 0;
        }

        .draw-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 30px; /* ボタンも少しスリムに */
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #d64545;
            transition: all 0.2s;
            width: 100%;
        }

        .draw-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d64545;
        }
        
        .draw-button:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .back-button {
            background: transparent;
            color: #888;
            border: 2px solid #ddd;
            padding: 8px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">レシピガチャ</h1>
        <p class="description">みんなが作ったリメイクレシピが<br>ランダムで出てくるよ！</p>
        
        <div class="gacha-machine-container">
            <div id="machine-view" class="machine-illustration">
                <div class="emoji-icon">🍳</div>
                <div class="machine-text">下のボタンを押して<br>今日のレシピを占おう！</div>
            </div>

            <div id="result-view" class="result-view">
                <h2 id="gacha-recipe-name" class="recipe-name">料理名</h2>
                
                <div class="image-container">
                    <img id="gacha-recipe-image" src="" alt="料理画像" class="gacha-image">
                </div>

                <div class="gacha-details">
                    <p id="gacha-description" class="description-text">解説テキスト</p>
                    <ul id="gacha-ingredients" class="ingredients-list">
                        </ul>
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button id="draw-button" type="button" class="draw-button">ガチャを回す</button>
            <button type="button" onclick="location.href='./index.html'" class="back-button">TOPへ戻る</button>
        </div>
    </div>

    <script>
        document.getElementById('draw-button').addEventListener('click', async () => {
            const btn = document.getElementById('draw-button');
            const machineView = document.getElementById('machine-view');
            const resultView = document.getElementById('result-view');
            const machineText = document.querySelector('.machine-text');
            
            const nameText = document.getElementById('gacha-recipe-name');
            const imgElement = document.getElementById('gacha-recipe-image');
            const descText = document.getElementById('gacha-description');
            const ingredientsList = document.getElementById('gacha-ingredients');

            // --- 演出開始 ---
            btn.disabled = true;
            btn.textContent = "抽選中...";
            
            resultView.style.display = 'none';
            machineView.style.display = 'block';
            machineText.innerHTML = 'どれにしようかな...';

            try {
                // API呼び出し
                const response = await fetch('/api/gacha');
                const recipe = await response.json();

                if (!recipe) {
                    alert("レシピが見つかりませんでした");
                    btn.disabled = false;
                    btn.textContent = "ガチャを回す";
                    machineText.innerHTML = '下のボタンを押して<br>今日のレシピを占おう！';
                    return;
                }

                // --- データのセット ---
                nameText.textContent = recipe.recipeName;
                imgElement.src = recipe.imageUrl || './img/gurumeika-3.jpg';
                descText.textContent = recipe.description || "美味しいレシピです！";

                ingredientsList.innerHTML = "";
                if (recipe.ingredients && Array.isArray(recipe.ingredients)) {
                    recipe.ingredients.forEach(ing => {
                        const li = document.createElement('li');
                        li.textContent = ing;
                        ingredientsList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = "材料データなし";
                    ingredientsList.appendChild(li);
                }

                // --- 画面切り替え ---
                setTimeout(() => {
                    machineView.style.display = 'none';
                    resultView.style.display = 'block';
                    
                    btn.disabled = false;
                    btn.textContent = "もう一度回す";
                    machineText.innerHTML = '下のボタンを押して<br>今日のレシピを占おう！';
                }, 800);

            } catch (error) {
                console.error("Gacha Error:", error);
                alert("通信エラーが発生しました");
                btn.disabled = false;
                btn.textContent = "ガチャを回す";
                machineText.innerHTML = '下のボタンを押して<br>今日のレシピを占おう！';
            }
        });
    </script>
</body>
</html>
